name: Release

# 两种发版方式：
# 1. 推荐：在 Actions 页面手动运行本工作流并填写版本号。工作流会同步版本号、提交、
#    打标签，然后构建全部平台并发布 Release。
# 2. 本地已用 `npm run sync:version` 提交版本号时，直接推送 vX.Y.Z 标签。
# 两种方式都要求 docs/更新日志-X.Y.md 中已有 "## X.Y.Z" 小节，作为 Release 说明。

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 新版本号（x.y.z，例如 6.6.0）
        type: string
        required: true
      draft:
        description: 创建为草稿 Release（检查无误后在 GitHub 上手动发布）
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 手动发版从默认分支最新提交开始；推送标签时使用标签本身
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="${INPUT_VERSION#v}"
            version="$(echo "$version" | tr -d '[:space:]')"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::版本号必须是 x.y.z 格式：$INPUT_VERSION"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "::error::标签 v$version 已存在。"
              exit 1
            fi
            # 允许与当前 VERSION 相同（已在本地同步过版本号但还没打标签），不允许回退
            if [[ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)" != "$version" ]]; then
              echo "::error::新版本 $version 低于当前版本 $current。"
              exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" != "$current" ]]; then
              echo "::error::标签 $GITHUB_REF_NAME 与 VERSION 文件中的 $current 不一致。"
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check release notes
        run: node scripts/project.mjs release-notes "${{ steps.version.outputs.version }}"

      - name: Commit version and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          node scripts/project.mjs sync-version "$VERSION"
          node scripts/project.mjs check-version

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git commit -am "release: prepare version $VERSION"
          fi
          git tag -a "v$VERSION" -m "Release v$VERSION"
          # 分支和标签原子推送；用 GITHUB_TOKEN 推送的标签不会再次触发本工作流
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/v$VERSION"

  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum -- * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          {
            node scripts/project.mjs release-notes "$VERSION"
            cat <<EOF

          ## 下载

          | 平台 | 安装包 |
          | --- | --- |
          | Windows（x64） | \`Teleprompter-Tauri-$VERSION-Windows-x64-Setup.exe\` |
          | Windows（ARM64） | \`Teleprompter-Tauri-$VERSION-Windows-arm64-Setup.exe\` |
          | macOS 10.15+（Apple 芯片与 Intel 通用） | \`Teleprompter-Tauri-$VERSION-macOS-universal.dmg\` |
          | Linux（x86_64） | \`.AppImage\`、\`.deb\`（Debian / Ubuntu）、\`.rpm\`（Fedora / openSUSE） |
          | Linux（ARM64） | \`.AppImage\`、\`.deb\`、\`.rpm\` |

          Electron Windows x64 便携版和安装版继续作为备用版本提供。\`SHA256SUMS.txt\` 为全部文件的校验清单。

          > 当前安装包尚未配置代码签名。Windows 可能显示 SmartScreen 警告；macOS 首次打开如提示"已损坏"或"无法验证开发者"，请将应用拖入"应用程序"后在终端执行 \`xattr -cr /Applications/提词器.app\`，或在"系统设置 → 隐私与安全性"中选择"仍要打开"。
          EOF
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ inputs.draft && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            # 重跑时更新已有 Release，覆盖同名文件
            gh release edit "$TAG" --title "提词器 $TAG" --notes-file release-notes.md
            gh release upload "$TAG" release-assets/* --clobber
          else
            args=(--title "提词器 $TAG" --notes-file release-notes.md --verify-tag)
            if [[ "$DRAFT" == "true" ]]; then
              args+=(--draft)
            fi
            gh release create "$TAG" "${args[@]}" release-assets/*
          fi
