name: Build And Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must use semantic versioning: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install root dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run project checks
        run: npm run check

  tauri:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --bundles nsis
          - platform: macos
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
          - platform: linux
            os: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: Install Tauri dependencies
        working-directory: tauri
        run: npm ci

      - name: Build Tauri bundles
        working-directory: tauri
        run: npm run build -- ${{ matrix.args }}

      - name: Collect release files
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          bundle=tauri/src-tauri/target/release/bundle
          prefix="Teleprompter-Tauri-$VERSION"

          copy_one() {
            local files=($1)
            if [[ ${#files[@]} -ne 1 ]]; then
              echo "Expected exactly one file for $1, found ${#files[@]}" >&2
              exit 1
            fi
            cp "${files[0]}" "release-assets/$2"
          }

          case "$PLATFORM" in
            windows)
              copy_one "$bundle/nsis/*.exe" "$prefix-Windows-x64-Setup.exe"
              ;;
            macos)
              copy_one "tauri/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg" "$prefix-macOS-universal.dmg"
              ;;
            linux)
              copy_one "$bundle/deb/*.deb" "$prefix-Linux-amd64.deb"
              copy_one "$bundle/appimage/*.AppImage" "$prefix-Linux-x86_64.AppImage"
              ;;
          esac
          ls -l release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: tauri-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: error

  # Electron 版仅作为 Windows 备用版本继续发布。
  electron:
    needs: check
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows-electron/package-lock.json

      - name: Install Electron dependencies
        working-directory: windows-electron
        run: npm ci

      # Build the unpacked directory once, then package it twice. This avoids
      # repeating the Electron application packaging work for each target.
      - name: Build Electron application directory
        working-directory: windows-electron
        run: npx electron-builder --win dir --x64 --config.win.signAndEditExecutable=false

      - name: Build Electron portable package
        working-directory: windows-electron
        run: npx electron-builder --win portable --x64 --prepackaged dist/win-unpacked --config.win.signAndEditExecutable=false --config.directories.output=dist/portable

      - name: Build Electron installer
        working-directory: windows-electron
        run: npx electron-builder --win nsis --x64 --prepackaged dist/win-unpacked --config.win.signAndEditExecutable=false --config.directories.output=dist/nsis

      - name: Collect release files
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp windows-electron/dist/portable/*.exe "release-assets/Teleprompter-Electron-$VERSION-Windows-x64-Portable.exe"
          cp windows-electron/dist/nsis/*.exe "release-assets/Teleprompter-Electron-$VERSION-Windows-x64-Setup.exe"
          ls -l release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: electron-windows
          path: release-assets/
          if-no-files-found: error

  release:
    needs: [check, tauri, electron]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: |
          sha256sum -- * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined artifact
        uses: actions/upload-artifact@v5
        with:
          name: teleprompter-${{ needs.check.outputs.version }}
          path: release-assets/
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 提词器 ${{ github.ref_name }}
          body: |
            ## 下载

            | 平台 | 推荐安装包 |
            | --- | --- |
            | Windows | `Teleprompter-Tauri-*-Windows-x64-Setup.exe` |
            | macOS（Apple 芯片与 Intel 通用） | `Teleprompter-Tauri-*-macOS-universal.dmg` |
            | Linux | `Teleprompter-Tauri-*-Linux-x86_64.AppImage` 或 `.deb` |

            Electron Windows 便携版和安装版继续作为备用版本提供。`SHA256SUMS.txt` 为全部文件的校验清单。

            > 当前安装包尚未配置代码签名。Windows 可能显示 SmartScreen 警告；macOS 首次打开如提示"已损坏"或"无法验证开发者"，请将应用拖入"应用程序"后在终端执行 `xattr -cr /Applications/提词器.app`，或在"系统设置 → 隐私与安全性"中选择"仍要打开"。
          files: |
            release-assets/*
